# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Parchment mappings (parameter names + javadoc) layered over Mojang official mappings.
# Kept in sync with the NeoForge project's parchment version for consistent param names.
# See https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod Properties
version=1.1.2
group=com.casp3rnz.mmoecon

# Dependencies
fabric_api_version=0.116.15+1.21.1
# LuckPerms-compatible permissions (me.lucko:fabric-permissions-api), on Maven Central.
fabric_permissions_version=0.3.3
